name: stock-market

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: stock-market-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 18
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: stock-market-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_market}
      POSTGRES_USER: ${POSTGRES_USER:-stock_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_app_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: stock-market-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-StockMarket_SA_123!}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: stock-market-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-StockMarket_Oracle_123!}
      APP_USER: ${ORACLE_APP_USER:-stock_app}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:-stock_app_password}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 30

  database-migrations:
    build:
      context: ./database-migrations
    container_name: stock-market-database-migrations
    depends_on:
      postgres:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
      oracle:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_market}
      POSTGRES_USER: ${POSTGRES_USER:-stock_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_app_password}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-StockMarket_SA_123!}
      SQLSERVER_USER: ${SQLSERVER_USER:-stock_app}
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD:-StockMarket_App_123!}
      ORACLE_APP_USER: ${ORACLE_APP_USER:-stock_app}
      ORACLE_APP_PASSWORD: ${ORACLE_APP_PASSWORD:-stock_app_password}
    restart: "no"

volumes:
  postgres-data:
  sqlserver-data:
  oracle-data:
