<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stock Portfolio</title>
    <style>
        :root { color-scheme: light; }
        body { background: #f6f8fb; color: #172033; font-family: sans-serif; margin: 0; }
        main { margin: 0 auto; max-width: 70rem; padding: 4rem 1.5rem; }
        .eyebrow { color: #1769e0; font-weight: bold; letter-spacing: .08em; text-transform: uppercase; }
        h1 { font-size: clamp(2.2rem, 6vw, 4rem); line-height: 1.05; margin: .75rem 0 1rem; }
        .intro { color: #526078; font-size: 1.15rem; max-width: 42rem; }
        .links { display: grid; gap: 1rem; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 2.5rem; }
        .card { background: white; border: 1px solid #dfe5ef; border-radius: .75rem; color: inherit;
                display: block; padding: 1.5rem; text-decoration: none; }
        .card:hover { border-color: #1769e0; box-shadow: 0 .5rem 1.5rem #17203314; }
        .card h2 { margin: 0 0 .5rem; }
        .card p { color: #526078; margin: 0; }
        @media (max-width: 600px) { .links { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<main>
    <div class="eyebrow">Stock Portfolio</div>
    <h1>Manage your portfolio in real time.</h1>
    <p class="intro">
        Follow Kafka-powered market updates, search available stocks, and buy
        fractional shares using your live USD balance.
    </p>
    <section class="links" aria-label="Application areas">
        <a class="card" href="/live-market">
            <h2>Live market</h2>
            <p>Search stocks, watch live prices, and buy fractional shares.</p>
        </a>
        <a class="card" href="/assets">
            <h2>Assets</h2>
            <p>View the available asset inventory.</p>
        </a>
    </section>
</main>
</body>
</html>
