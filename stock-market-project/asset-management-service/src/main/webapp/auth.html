<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Sign in &middot; Stock Portfolio</title>
    <link rel="icon" href="static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="static/css/app.css">
    <script src="static/js/app.js" defer></script>
    <script src="static/js/auth.js" defer></script>
</head>
<body>
<main id="main" class="auth-shell">
    <div class="card auth-card">
        <div class="brand">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M3 17l6-6 4 4 8-8"/>
                <path d="M15 7h6v6"/>
            </svg>
            Stock Portfolio
        </div>

        <div class="tabs" role="tablist" aria-label="Account access">
            <button type="button" role="tab" id="tab-login" aria-controls="panel-login" aria-selected="true">
                Log in
            </button>
            <button type="button" role="tab" id="tab-register" aria-controls="panel-register" aria-selected="false"
                    tabindex="-1">
                Create account
            </button>
        </div>

        <section id="panel-login" role="tabpanel" aria-labelledby="tab-login">
            <form id="login-form" class="stack-form" novalidate>
                <div class="field">
                    <label for="login-username">Username</label>
                    <input id="login-username" class="input" name="username" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="login-password">Password</label>
                    <div class="password-row">
                        <input id="login-password" class="input" name="password" type="password"
                               autocomplete="current-password" required>
                        <button type="button" class="btn ghost sm" data-toggle-password="login-password"
                                aria-pressed="false">Show</button>
                    </div>
                </div>
                <button class="btn" type="submit">Log in</button>
            </form>
        </section>

        <section id="panel-register" role="tabpanel" aria-labelledby="tab-register" hidden>
            <form id="register-form" class="stack-form" novalidate>
                <div class="field">
                    <label for="register-username">Username</label>
                    <input id="register-username" class="input" name="username" autocomplete="username" required
                           minlength="3" maxlength="80" pattern="[A-Za-z0-9_]{3,80}"
                           aria-describedby="register-username-help">
                    <span class="help" id="register-username-help">3&ndash;80 letters, numbers, or underscores.</span>
                </div>
                <div class="field">
                    <label for="register-email">Email</label>
                    <input id="register-email" class="input" name="email" type="email" autocomplete="email"
                           maxlength="255" required>
                </div>
                <div class="field">
                    <label for="register-password">Password</label>
                    <div class="password-row">
                        <input id="register-password" class="input" name="password" type="password"
                               autocomplete="new-password" minlength="10" maxlength="200" required
                               aria-describedby="register-password-help">
                        <button type="button" class="btn ghost sm" data-toggle-password="register-password"
                                aria-pressed="false">Show</button>
                    </div>
                    <span class="help" id="register-password-help">At least 10 characters.</span>
                </div>
                <button class="btn" type="submit">Create account</button>
                <p class="help">New accounts start with a &ldquo;Main portfolio&rdquo; holding $1,000.00 in cash.</p>
            </form>
        </section>

        <p id="form-message" class="form-message" role="alert"></p>
    </div>
</main>
<div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
</body>
</html>
